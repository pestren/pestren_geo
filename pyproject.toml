[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pestren-geo"
version = "0.1.0"
description = "Raster measurement with its provenance attached"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26,<2.1"]

[project.optional-dependencies]
# Classical raster ops, and the torch-free feature-matching backend.
opencv = ["opencv-python-headless>=5.0"]
# The reference feature-matching backend.
kornia = ["kornia>=0.7", "torch>=2.0"]
io = ["rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pestren_geo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
